name: Android app

# Builds the StrikeSense Android app (android/) with the official Android
# tools, saves it as android/release/StrikeSense.apk and as a release.

on:
  push:
    paths:
      - "android/**"
      - "StrikeSense_NoLoRa/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the app
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Copy the app file
        run: |
          mkdir -p android/release
          cp android/app/build/outputs/apk/release/app-release.apk android/release/StrikeSense.apk
          ls -la android/release

      - uses: actions/upload-artifact@v4
        with:
          name: StrikeSense-app
          path: android/release/StrikeSense.apk

      - name: Save the app in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/release/StrikeSense.apk
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Android app: build ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest android/release/StrikeSense.apk \
            --title "StrikeSense Android app" \
            --notes "Download StrikeSense.apk on your Android phone and open it to install." \
            --target "${GITHUB_SHA}"
