name: Rod firmware

# Compiles both rod sketches for the XIAO ESP32-S3 (the same as the
# Arduino IDE does), so a mistake shows up before you upload.

on:
  push:
    paths:
      - "StrikeSense/**"
      - "StrikeSense_NoLoRa/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:XIAO_ESP32S3
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: SparkFun LIS3DH Arduino Library
            - name: RadioLib
          sketch-paths: |
            - StrikeSense_NoLoRa
            - StrikeSense
          enable-warnings-report: true
          verbose: false
