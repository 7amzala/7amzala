name: Rod firmware

# Compiles both rod sketches for the XIAO ESP32-S3 and the watch with arduino-cli (the
# same compiler as the Arduino IDE), so a mistake shows up before you upload.

on:
  push:
    paths:
      - "StrikeSense/**"
      - "StrikeSense_NoLoRa/**"
      - "watch_ble/**"
      - "sim/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rod <-> watch LoRa link test (PC simulation)
        run: |
          cd sim
          W=../watch_ble/StrikeSense_Watch
          g++ -O2 -std=c++17 -Imock -Imock_lora -I$W -o link_test link_test.cpp $W/lora_link.cpp $W/link_merge.c $W/ss_crypto.c
          ./link_test

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 boards and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

          # "update-index" fails to unpack Arduino's index on the runners:
          # show why, then fetch the index files directly instead
          arduino-cli core update-index --log-level debug 2>&1 | tail -20 || true
          mkdir -p ~/.arduino15
          curl -fsSL https://downloads.arduino.cc/packages/package_index.json -o ~/.arduino15/package_index.json
          curl -fsSL https://espressif.github.io/arduino-esp32/package_esp32_index.json -o ~/.arduino15/package_esp32_index.json

          arduino-cli core install esp32:esp32
          arduino-cli lib update-index
          arduino-cli lib install "SparkFun LIS3DH Arduino Library" RadioLib "lvgl@8.3.11"
          # An old-style lv_conf.h (48 KB, no big fonts) like on a tester's PC:
          # the watch must still build, because its build_opt.h overrides it.
          sed -e 's/(64U \* 1024U)/(48U * 1024U)/' -e 's/MONTSERRAT_\(28\|36\|48\) 1/MONTSERRAT_\1 0/' watch_ble/lv_conf.h > ~/Arduino/libraries/lv_conf.h
          grep -n "LV_MEM_SIZE (\|MONTSERRAT_\(28\|36\|48\) " ~/Arduino/libraries/lv_conf.h
          arduino-cli core list

      - name: Compile StrikeSense_NoLoRa
        run: arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32S3 --warnings default StrikeSense_NoLoRa

      - name: Compile StrikeSense (LoRa)
        if: always()
        run: arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32S3 --warnings default StrikeSense

      - name: Compile the watch (Bluetooth)
        if: always()
        run: arduino-cli compile --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=huge_app,PSRAM=opi" --warnings default watch_ble/StrikeSense_Watch
