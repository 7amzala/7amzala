plugins {
    id "com.android.application"
}

android {
    namespace "com.laarif.strikesense"
    compileSdk 34

    defaultConfig {
        applicationId "com.laarif.strikesense"
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName "3.4 (one phone per rod, search + sort, profile picture)"
    }

    // Alarm sounds are read straight from the app (RodService): not compressed
    androidResources {
        noCompress "ogg"
    }

    // The app's own signing key (a personal app, not on the Play Store).
    // Keep this file: an update must be signed with the same key.
    signingConfigs {
        release {
            storeFile file("strikesense.keystore")
            storePassword "strikesense"
            keyAlias "strikesense"
            keyPassword "strikesense"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    sourceSets {
        main {
            assets.srcDirs += [file("$buildDir/generated/dashboard")]
        }
    }
}

// The dashboard page is written once, in the rod sketch. Copy it into the
// app at every build, so the app always shows the same page.
def sketch = rootProject.file("../StrikeSense_NoLoRa/StrikeSense_NoLoRa.ino")
def dashboardDir = file("$buildDir/generated/dashboard")

def extractDashboard = tasks.register("extractDashboard") {
    inputs.file(sketch)
    outputs.dir(dashboardDir)

    doLast {
        def text = sketch.getText("UTF-8")
        def startMark = 'R"rawliteral('
        def a = text.indexOf(startMark)
        def b = text.indexOf(')rawliteral"', a)

        if(a < 0 || b < 0)
            throw new GradleException("Dashboard page not found in " + sketch)

        dashboardDir.mkdirs()
        new File(dashboardDir, "dashboard.html").setText(text.substring(a + startMark.length(), b), "UTF-8")
    }
}

tasks.named("preBuild") {
    dependsOn extractDashboard
}
